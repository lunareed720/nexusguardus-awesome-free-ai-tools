name: Weekly Link Checker

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all tool URLs
        run: python3 .github/scripts/check_links.py
      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Broken tool links detected',
              body: 'One or more tool URLs are no longer accessible. Check the workflow logs for details.'
            })