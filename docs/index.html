<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Awesome Free AI Tools — Curated No-Paywall AI Catalog</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: #0d1117; color: #c9d1d9; }
    .hero { text-align: center; padding: 80px 20px 60px; background: linear-gradient(135deg, #0d1117 0%, #161b22 100%); }
    .hero h1 { font-size: 3rem; color: #f0f6fc; margin-bottom: 8px; }
    .hero h1 span { color: #58a6ff; }
    .hero p { font-size: 1.2rem; color: #8b949e; margin-bottom: 32px; }
    .badges { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .badge { padding: 6px 16px; border-radius: 20px; font-size: .85rem; }
    .badge-green { background: #1a4d3e; color: #3fb950; border: 1px solid #3fb95055; }
    .badge-blue  { background: #0d3062; color: #58a6ff; border: 1px solid #58a6ff55; }
    .badge-org   { background: #3d1d00; color: #f0883e; border: 1px solid #f0883e55; }
    .content { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
    .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
    .tool-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; transition: border-color .2s; }
    .tool-card:hover { border-color: #58a6ff; }
    .tool-card h3 { font-size: 1.1rem; color: #f0f6fc; margin-bottom: 8px; }
    .tool-card a { color: #58a6ff; text-decoration: none; }
    .tool-card .meta { font-size: .85rem; color: #8b949e; margin-top: 12px; flex-wrap: wrap; }
    .empty { text-align: center; color: #8b949e; padding: 60px 20px; }
    .empty h2 { font-size: 1.5rem; color: #f0f6fc; margin-bottom: 8px; }
    footer { text-align: center; padding: 40px; color: #484f58; font-size: .85rem; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>🔥 <span>Awesome Free</span> AI Tools</h1>
    <p>Curated directory of genuinely free AI tools — no credit card, no trial traps.</p>
    <div class="badges">
      <span class="badge badge-green">✅ No CC required</span>
      <span class="badge badge-blue">📦 Self-host included</span>
      <span class="badge badge-org">🎯 Privacy-first</span>
    </div>
  </div>
  <div class="content">
    <div class="empty">
      <h2>🚀 Under Construction</h2>
      <p>35+ AI tools coming soon. Star this repo to get notified.</p>
      <p style="margin-top:20px">
        <a href="https://github.com/gnifhx/awesome-free-ai-tools" style="color:#58a6ff">⭐ Star on GitHub</a>
      </p>
    </div>
  </div>
  <footer>
    <a href="https://github.com/gnifhx/awesome-free-ai-tools" style="color:#8b949e">GitHub</a>
    · CC0 License · No tracking
  </footer>
</body>
</html>
